<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<title>Engine Stopped - Harness Launcher</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(700px 400px at 80% -10%, rgba(34,211,238,0.10), transparent 60%),
      radial-gradient(700px 400px at 0% 110%, rgba(59,130,246,0.12), transparent 55%),
      #0a1120;
    color: #e8eef8;
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  @media (prefers-color-scheme: light) {
    body { background:
      radial-gradient(700px 400px at 80% -10%, rgba(34,211,238,0.14), transparent 60%),
      radial-gradient(700px 400px at 0% 110%, rgba(59,130,246,0.16), transparent 55%),
      #f4f6fa;
      color: #1d2430; }
    h1 { color: #1d2430; }
    .sub { color: #8b96a8; }
    p { color: #5a6679; }
    .logo { border-color: #d6dbe4; box-shadow: 0 8px 30px rgba(0,0,0,0.10), 0 0 40px rgba(34,211,238,0.10); }
    button.ghost { border-color: #c9d0dc; color: #3d4657; }
    button.ghost:hover { background: rgba(59,130,246,0.10); }
    .hint { color: #8b96a8; }
  }
  .card { text-align: center; max-width: 440px; padding: 30px 34px; }
  .logo { width: 76px; height: 76px; border-radius: 18px; overflow: hidden; margin: 0 auto 16px;
    border: 1px solid #2a3d61; box-shadow: 0 8px 30px rgba(0,0,0,0.45), 0 0 40px rgba(34,211,238,0.15); }
  .logo img { width: 100%; height: 100%; display: block; object-fit: cover; }
  h1 { font-size: 19px; margin: 0 0 8px; font-weight: 650; letter-spacing: 0.2px; }
  .sub { color: #5f7294; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
  p { color: #93a7c4; margin: 0 0 20px; font-size: 12.5px; }
  button { background: linear-gradient(135deg, #2563eb, #3b82f6); border: none; color: #fff; border-radius: 9px;
    padding: 10px 20px; font-size: 13.5px; font-weight: 600; cursor: pointer; margin: 4px; }
  button:hover { filter: brightness(1.1); }
  button.ghost { background: transparent; border: 1px solid #2a3d61; color: #c7d6ec; }
  button.ghost:hover { background: rgba(59,130,246,0.12); }
  .hint { margin-top: 18px; font-size: 11px; color: #5f7294; min-height: 16px; }
  a.brand-link { display: block; text-decoration: none; color: inherit; cursor: pointer;
    border-radius: 12px; }
  a.brand-link:focus-visible { outline: 2px solid #3b82f6; outline-offset: 4px; }
</style>
</head>
<body>
  <div class="card">
    <a class="brand-link" id="brand-link" href="https://github.com/MarcoLeongDev/harness-launcher" title="Open Harness Launcher on GitHub" aria-label="Open Harness Launcher on GitHub" data-i18n-title="brandGithub" data-i18n-aria="brandGithub">
      <div class="logo"><img id="brand-logo" src="dsh-ui://localhost/brand/logo.png" alt="Harness Launcher logo" data-i18n-alt="logoAlt" /></div>
      <h1>Harness Launcher</h1>
    </a>
    <div class="sub" data-i18n="stoppedSub">The harness engine is stopped</div>
    <p data-i18n="stoppedDesc">The DeepSeek Harness background engine is not running. Start it to open the harness UI, or open the Control Panel to manage versions, updates, port and logs.</p>
    <button id="btn-start" data-i18n="startEngine">Start Engine</button>
    <button id="btn-settings" class="ghost" data-i18n="openPanel">Open Control Panel</button>
    <div class="hint" id="hint"></div>
  </div>
<script>
(function () {
  'use strict';
  function invoke(cmd, args) {
    var core = window.__TAURI__ && window.__TAURI__.core;
    if (core && typeof core.invoke === 'function') return core.invoke(cmd, args || {});
    if (window.__TAURI_INTERNALS__ && typeof window.__TAURI_INTERNALS__.invoke === 'function')
      return window.__TAURI_INTERNALS__.invoke(cmd, args || {}, undefined);
    return Promise.reject(new Error('Tauri IPC unavailable'));
  }
  var LOCALES = {
    en: {
      title: "Engine Stopped - Harness Launcher",
      stoppedSub: "The harness engine is stopped",
      stoppedDesc: "The DeepSeek Harness background engine is not running. Start it to open the harness UI, or open the Control Panel to manage versions, updates, port and logs.",
      startEngine: "Start Engine",
      openPanel: "Open Control Panel",
      brandGithub: "Open Harness Launcher on GitHub",
      logoAlt: "Harness Launcher logo"
    },
    "zh-Hant": {
      title: "引擎已停止 - Harness Launcher",
      stoppedSub: "Harness 引擎已停止",
      stoppedDesc: "DeepSeek Harness 背景引擎尚未執行。啟動以開啟 Harness 介面，或開啟控制面板以管理版本、更新、連接埠和日誌。",
      startEngine: "啟動引擎",
      openPanel: "開啟控制面板",
      brandGithub: "在 GitHub 上開啟 Harness Launcher",
      logoAlt: "Harness Launcher 標誌"
    },
    "zh-Hans": {
      title: "引擎已停止 - Harness Launcher",
      stoppedSub: "Harness 引擎已停止",
      stoppedDesc: "DeepSeek Harness 后台引擎尚未运行。启动以打开 Harness 界面，或打开控制面板以管理版本、更新、端口和日志。",
      startEngine: "启动引擎",
      openPanel: "打开控制面板",
      brandGithub: "在 GitHub 上打开 Harness Launcher",
      logoAlt: "Harness Launcher 标志"
    },
    ja: {
      title: "エンジン停止中 - Harness Launcher",
      stoppedSub: "Harness エンジンは停止しています",
      stoppedDesc: "DeepSeek Harness バックグラウンドエンジンは実行されていません。起動して Harness UI を開くか、コントロールパネルでバージョン・更新・ポート・ログを管理してください。",
      startEngine: "エンジンを起動",
      openPanel: "コントロールパネルを開く",
      brandGithub: "GitHub で Harness Launcher を開く",
      logoAlt: "Harness Launcher のロゴ"
    },
    es: {
      title: "Motor detenido - Harness Launcher",
      stoppedSub: "El motor Harness está detenido",
      stoppedDesc: "El motor en segundo plano de DeepSeek Harness no está en ejecución. Inícialo para abrir la interfaz de Harness o abre el panel de control para gestionar versiones, actualizaciones, puerto y registros.",
      startEngine: "Iniciar motor",
      openPanel: "Abrir panel de control",
      brandGithub: "Abrir Harness Launcher en GitHub",
      logoAlt: "Logotipo de Harness Launcher"
    }
  };
  var lang = "en";
  function t(key) { return (LOCALES[lang] && LOCALES[lang][key]) || LOCALES.en[key] || key; }
  function applyLanguage(l) {
    if (!LOCALES[l]) l = "en";
    lang = l;
    try { document.documentElement.lang = l; } catch (e) {}
    try { document.title = t("title"); } catch (e) {}
    var i, els;
    els = document.querySelectorAll("[data-i18n]");
    for (i = 0; i < els.length; i++) els[i].textContent = t(els[i].getAttribute("data-i18n"));
    els = document.querySelectorAll("[data-i18n-title]");
    for (i = 0; i < els.length; i++) els[i].title = t(els[i].getAttribute("data-i18n-title"));
    els = document.querySelectorAll("[data-i18n-aria]");
    for (i = 0; i < els.length; i++) els[i].setAttribute("aria-label", t(els[i].getAttribute("data-i18n-aria")));
    els = document.querySelectorAll("[data-i18n-alt]");
    for (i = 0; i < els.length; i++) els[i].setAttribute("alt", t(els[i].getAttribute("data-i18n-alt")));
  }
  function refresh() {
    invoke("get_status", {}).then(function (s) {
      if (s && s.language) applyLanguage(s.language);
    }).catch(function () { applyLanguage("en"); });
  }
  var hint = document.getElementById("hint");
  function run(fn) {
    hint.textContent = "...";
    fn().then(function (r) {
      hint.textContent = (r && r.message) || "done";
      setTimeout(function () { hint.textContent = ""; }, 4000);
    }).catch(function (e) {
      hint.textContent = String(e && e.message || e);
    });
  }
  document.getElementById("btn-start").addEventListener("click", function () {
    run(function () { return invoke("engine_start", {}); });
  });
  document.getElementById("btn-settings").addEventListener("click", function () {
    run(function () { return invoke("open_settings", {}); });
  });
  document.getElementById("brand-link").addEventListener("click", function (e) {
    e.preventDefault();
    invoke("open_repo_page", {}).catch(function (err) {
      hint.textContent = String(err && err.message || err);
    });
  });
  refresh();
  try { setInterval(refresh, 3000); } catch (e) {}
  try { document.addEventListener("visibilitychange", function () { if (!document.hidden) refresh(); }); } catch (e) {}
  try { window.addEventListener("focus", refresh); } catch (e) {}
})();
</script>
</body>
</html>
