<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<title>Harness Launcher - Control Panel</title>
<style>
  :root { color-scheme: light dark; }
  /* Dark palette (default). The native macOS titlebar follows the system
     appearance, and the light overrides below keep the content in step so
     the whole window follows the system theme. */
  :root {
    --bg: #0a0e17; --bg2: #0d1220;
    --cell: rgba(255,255,255,0.055); --cell-hover: rgba(255,255,255,0.08);
    --hair: rgba(255,255,255,0.09); --hair2: rgba(255,255,255,0.16);
    --text: #f2f5fa; --dim: #98a5bf; --faint: #5d6c8c;
    --accent: #0a84ff; --accent2: #40a9ff;
    --ok: #30d158; --warn: #ffd60a; --err: #ff453a;
    --radius: 13px;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f5f6f8; --bg2: #eceef2;
      --cell: rgba(0,0,0,0.045); --cell-hover: rgba(0,0,0,0.085);
      --hair: rgba(0,0,0,0.10); --hair2: rgba(0,0,0,0.18);
      --text: #1d2430; --dim: #5a6679; --faint: #98a1b0;
      --accent: #0071e3; --accent2: #0077ed;
      --ok: #1f9d4d; --warn: #b58a00; --err: #d70015;
    }
    body { -webkit-font-smoothing: auto; }
    .logo { background: #fff; }
    .switch .slider { background: rgba(0,0,0,0.12); }
    .switch input:checked + .slider { background: var(--ok); }
    input[type=number], select { background: rgba(255,255,255,0.85); }
    .pop { background: #ffffff; box-shadow: 0 12px 32px rgba(0,0,0,0.18); }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; color: var(--text); overflow: hidden;
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    background: linear-gradient(180deg, var(--bg2), var(--bg)); min-height: 100vh;
    display: flex; flex-direction: column; -webkit-font-smoothing: antialiased;
    overflow: hidden; }
  /* Minimal iOS-style scroll bars */
  *::-webkit-scrollbar { width: 3px; height: 3px; }
  *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-thumb { background: var(--faint); border-radius: 2px; }
  *::-webkit-scrollbar-thumb:hover { background: var(--dim); }
  * { scrollbar-width: thin; scrollbar-color: var(--faint) transparent; }
  svg.ico { width: 20px; height: 20px; flex: none; }
  svg.ico.sm { width: 16px; height: 16px; }
  /* header */
  header { display: flex; align-items: center; gap: 10px; padding: 14px 22px 10px; }
  .logo { width: 34px; height: 34px; border-radius: 9px; overflow: hidden; flex: none;
    border: 1px solid var(--hair2); background: #fff; }
  .logo img { width: 100%; height: 100%; display: block; object-fit: cover; }
  .header-title { font-size: 15px; font-weight: 650; letter-spacing: -0.2px; }
  /* Brand link: the logo, app name and launcher version open the project
     GitHub page. Unstyled — inherits the surrounding header look (no
     underline, no color shift, no extra decoration); only clickable. */
  a.brand-link { display: flex; align-items: center; gap: 10px;
    text-decoration: none; color: inherit; cursor: pointer; border-radius: 9px; }
  a.brand-link:focus-visible { outline: 2px solid var(--accent2); outline-offset: 2px; }
  header .spacer { flex: 1; }
  /* Launcher version: bare, subtle text — no tag styling. The header stays
     minimal: no engine version tag beside the power button. */
  .hdr-ver-subtle { font-family: var(--mono); font-size: 10.5px; color: var(--faint);
    letter-spacing: 0.2px; user-select: text; }
  .hdr-quit { width: 28px; height: 28px; border-radius: 50%; border: none;
    background: transparent; color: var(--dim); cursor: pointer; display: inline-flex;
    align-items: center; justify-content: center; padding: 0; flex: none; }
  .hdr-quit:hover { background: var(--cell-hover); }
  .hdr-quit svg { width: 16px; height: 16px; }
  .pill { display: inline-flex; align-items: center; gap: 7px; padding: 3px 11px; border-radius: 999px;
    font-size: 11.5px; font-weight: 550; color: var(--dim); background: var(--cell);
    border: 1px solid var(--hair); }
  .pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); display: inline-block; }
  .pill i.ok { background: var(--ok); box-shadow: 0 0 8px rgba(48,209,88,0.9); }
  .pill i.stop { background: var(--faint); }
  .pill i.err { background: var(--err); }
  main { flex: 1; min-height: 0; padding: 12px 22px 24px; margin: 0 auto; width: 100%;
    max-width: 640px; display: flex; flex-direction: column; overflow: hidden; }
  .tabpanel { display: none; flex-direction: column; gap: 14px;
    flex: 1; min-height: 0; overflow: auto; }
  .tabpanel.active { display: flex; }
  /* Log drawer: an in-flow bottom drawer of the merged panel, hidden by
     default; the bottom-right circular button toggles it. When open it takes
     a fixed band at the bottom of the window and the panel scrolls above. */
  .log-drawer { display: none; flex: none; border-top: 1px solid var(--hair2);
    background: var(--bg2); }
  .log-drawer.open { display: flex; flex-direction: column; height: 250px;
    animation: drawer-in .18s ease-out both; }
  @keyframes drawer-in { from { opacity: 0; transform: translateY(10px); } }
  @media (prefers-reduced-motion: reduce) { .log-drawer.open { animation: none; } }
  /* Log toggle: circle button, image only — no background or border (only a
     hover background), pinned bottom-right of the window. aria-pressed shows
     the toggled (open) state. */
  .log-toggle { position: fixed; right: 14px; bottom: 14px; z-index: 30;
    width: 34px; height: 34px; border-radius: 50%; border: none; padding: 0;
    background: transparent; color: var(--dim); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    transition: background .15s, color .15s; }
  .log-toggle:hover { background: var(--cell-hover); color: var(--accent2); }
  .log-toggle:active { transform: translateY(1px); }
  .log-toggle:focus-visible { outline: 2px solid var(--accent2); outline-offset: 2px; }
  .log-toggle[aria-pressed="true"] { color: var(--accent2); }
  .log-toggle svg { width: 17px; height: 17px; }
  /* grouped macOS-style rows */
  .group { background: var(--cell); border: 1px solid var(--hair); border-radius: var(--radius);
    overflow: visible; backdrop-filter: blur(8px); }
  .cell { display: flex; align-items: center; gap: 13px; padding: 13px 16px; min-height: 52px; }
  .cell + .cell { border-top: 1px solid var(--hair); }
  .cell.col { flex-direction: column; align-items: stretch; }
  .lbl { font-size: 13px; font-weight: 500; white-space: nowrap; }
  .hint { font-size: 11.5px; color: var(--dim); }
  /* buttons */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    padding: 7px 14px; border-radius: 8px; font-size: 12.5px; font-weight: 550; cursor: pointer;
    border: 1px solid var(--hair2); background: var(--cell); color: var(--text); transition: all .15s; }
  .btn:hover { background: var(--cell-hover); }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: 0.4; cursor: default; transform: none; }
  .btn:focus-visible { outline: 2px solid var(--accent2); outline-offset: 1px; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { background: #2f9bff; }
  .btn.ok { background: var(--ok); border-color: var(--ok); color: #04231a; }
  .btn.ok:hover { background: #4cd870; }
  .btn.warn { background: transparent; border-color: rgba(255,69,58,0.5); color: var(--err); }
  .btn.warn:hover { background: rgba(255,69,58,0.12); }
  .btn.icon { padding: 0; border-radius: 50%; width: 36px; height: 36px; border: none; background: transparent; color: var(--text); transition: background .15s, color .15s; }
  .btn.icon:hover { background: var(--cell-hover); color: var(--accent2); }
  input[type=number], select {
    background: rgba(0,0,0,0.3); color: var(--text); border: 1px solid var(--hair2);
    border-radius: 8px; padding: 6px 10px; font-size: 13px; font-family: var(--mono);
    appearance: none; -webkit-appearance: none; cursor: pointer; }
  input:focus, select:focus { outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(10,132,255,0.25); }
  select { font-family: inherit; }
  .err { color: var(--err); }
  .ok2 { color: var(--ok); }
  @keyframes spin { to { transform: rotate(360deg); } }
  .ico.spin { animation: spin .9s linear infinite; display: inline-block; }
  @media (prefers-reduced-motion: reduce) { .ico.spin { animation: none; } }
  /* engine card */
  .ec-row { display: flex; align-items: center; gap: 12px; padding: 14px 16px; flex-wrap: nowrap; }
  .ec-status-icon { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center;
    justify-content: center; flex: none; background: rgba(93,108,140,0.15);
    border: 1px solid rgba(93,108,140,0.4); color: var(--dim); }
  .ec-status-icon svg { width: 18px; height: 18px; }
  .ec-status-icon.running { background: rgba(48,209,88,0.12); border-color: rgba(48,209,88,0.45); color: var(--ok); }
  .ec-status-icon.running svg { animation: spin-gear 3s linear infinite; transform-origin: 50% 50%; }
  .ec-status-icon.stopped { background: rgba(93,108,140,0.15); border-color: rgba(93,108,140,0.4); color: var(--dim); }
  .ec-status-icon.error { background: rgba(255,69,58,0.12); border-color: rgba(255,69,58,0.45); color: var(--err); }
  @keyframes spin-gear { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .ec-ver { font-family: var(--mono); font-size: 13px; font-weight: 600; white-space: nowrap; }
  .ec-select { background: none; border: none; color: var(--text); font-family: var(--mono);
    font-size: 13px; font-weight: 600; cursor: pointer; padding: 0; appearance: none;
    -webkit-appearance: none; }
  .ec-select:focus { outline: none; }
  .ec-select-wrap { display: inline-flex; align-items: center; gap: 2px; cursor: pointer; }
  .ec-select-wrap svg { width: 10px; height: 10px; color: var(--faint); transition: transform .15s; flex: none; pointer-events: none; }
  select { background-image: none !important; }
  .ec-sep { color: var(--faint); font-size: 13px; }
  .ec-port { font-family: var(--mono); font-size: 13px; background: transparent; border: none;
    color: var(--text); width: 64px; padding: 2px 0; text-align: left; }
  .ec-port:focus { outline: none; border-bottom: 1px solid var(--accent); }
  .ec-open-btn { width: 28px; height: 28px; border-radius: 50%; border: none;
    background: transparent; color: var(--dim); cursor: pointer; display: inline-flex;
    align-items: center; justify-content: center; padding: 0; flex: none; }
  .ec-open-btn:hover { background: var(--cell-hover); }
  .ec-open-btn svg { width: 16px; height: 16px; }
  .ec-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .ec-btn { display: inline-flex; align-items: center; justify-content: center;
    width: 34px; height: 34px; border-radius: 50%; cursor: pointer; border: 1px solid var(--hair2);
    background: var(--cell); color: var(--text); transition: all .15s; flex: none; }
  .ec-btn svg { width: 16px; height: 16px; }
  .ec-btn:hover { background: var(--cell-hover); }
  .ec-btn:active { transform: translateY(1px); }
  .ec-btn:disabled { opacity: 0.4; cursor: default; transform: none; }
  .ec-btn.icon-start { background: var(--ok); border-color: var(--ok); color: #04231a; }
  .ec-btn.icon-start:hover { background: #4cd870; }
  .ec-btn.icon-stop { background: var(--err); border-color: var(--err); color: #fff; }
  .ec-btn.icon-stop:hover { background: #ff6259; }
  .ec-btn.icon-restart { background: transparent; }
  .ecterm-toggle { display: inline-flex; align-items: center; gap: 6px; background: none;
    border: none; color: var(--dim); font-size: 11.5px; cursor: pointer; padding: 8px 12px;
    border-radius: 6px; margin: 4px; }
  .ecterm-toggle:hover { color: var(--text); background: var(--cell-hover); }
  .ecterm-toggle svg { transition: transform .2s; }
  .ecterm-toggle.open svg { transform: rotate(180deg); }
  .ecterm { border-top: 1px solid var(--hair); background: rgba(0,0,0,0.35); display: none; }
  .ecterm.open { display: block; }
  /* Operation feeds: the notification surface of the panel, in their OWN
     section BELOW the versions table group (never between the table's rows).
     Each in-flight operation owns one feed — header with npm command +
     elapsed time, mono output lines, and the circular stop button overlaid
     on the output while that version downloads. Feeds stack; parallel
     downloads never share one. #op-feeds:empty (below) collapses the whole
     section once the last feed is removed. */
  .op-feed { border-top: 1px solid var(--hair); overflow: hidden;
    animation: feed-in .18s ease-out both; }
  .op-feed + .op-feed { border-top: 1px solid var(--hair); }
  /* Inside its own group the first feed's top border would double the group
     border — drop it. */
  .op-feeds-group .op-feed:first-child { border-top: none; }
  .op-feed.leaving { animation: feed-out .16s ease-in both; }
  #op-feeds:empty { display: none; }
  @keyframes feed-in { from { opacity: 0; transform: translateY(-6px); } }
  @keyframes feed-out { to { opacity: 0; transform: translateY(-6px); } }
  @media (prefers-reduced-motion: reduce) {
    .op-feed, .op-feed.leaving { animation: none; }
  }
  .op-feed-head { display: flex; align-items: center; gap: 8px; padding: 10px 16px 6px; }
  .op-feed-cmd { font-family: var(--mono); font-size: 10.5px; color: var(--faint);
    white-space: normal; word-break: break-all; flex: 1; min-width: 0; }
  .op-feed-elapsed { font-family: var(--mono); font-size: 11px; color: var(--faint);
    min-width: 40px; text-align: right; }
  .op-feed-body { position: relative; }
  /* Shared terminal styling: one look for every terminal surface in the app
     (operation feeds, harness log) — dark backing, mono, muted green text. */
  .terminal { background: rgba(0,0,0,0.35); color: #9bd1c0;
    font: 11px/1.5 var(--mono); white-space: pre-wrap; word-break: break-all; }
  .term-out { margin: 0; padding: 8px 16px 46px; max-height: 220px; overflow: auto;
    font-size: 10.5px; }
  .op-feed.idle .term-out { padding-bottom: 14px; }
  .term-out .ln { display: block; }
  .term-out .ln.out { color: #a9d5ff; }
  .term-out .ln.info { color: #8ecdf7; font-weight: 600; }
  .term-out .ln.err { color: #ff8a8a; }
  /* Logs tab now also surfaces the live engine run output (merged view) */

  /* version tiles */
  .ver-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .ver-tile { border: 1px solid var(--hair); border-radius: 10px; padding: 9px 11px;
    display: flex; flex-direction: column; gap: 6px; background: var(--cell); }
  .ver-tile .ver { font-family: var(--mono); font-size: 12.5px; font-weight: 600; }
  .ver-tile .meta { display: flex; align-items: center; gap: 5px; }
  .tag { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px;
    padding: 1.5px 7px; border-radius: 999px; }
  .tag.active { background: rgba(48,209,88,0.15); color: var(--ok); border: 1px solid rgba(48,209,88,0.35); }
  .tag.prev { background: rgba(255,214,10,0.1); color: var(--warn); border: 1px solid rgba(255,214,10,0.3); }
  .tag.inst { color: var(--faint); }
  .ver-tile .del { margin-left: auto; }
  /* switch */
  .switch { position: relative; display: inline-block; width: 40px; height: 24px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch .slider { position: absolute; inset: 0; background: rgba(0,0,0,0.3);
    border: 1px solid var(--hair2); border-radius: 999px; transition: .2s; }
  .switch .slider::before { content: ""; position: absolute; width: 18px; height: 18px; left: 2px; top: 2px;
    background: #fff; border-radius: 50%; transition: .2s; box-shadow: 0 1px 4px rgba(0,0,0,0.4); }
  .switch input:checked + .slider { background: var(--ok); border-color: var(--ok); }
  .switch input:checked + .slider::before { transform: translateX(16px); }
  .switch input:focus-visible + .slider { outline: 2px solid var(--accent2); outline-offset: 1px; }
  /* version table */
  .vhead { display: flex; align-items: center; gap: 16px; padding: 12px 16px;
    border-bottom: 1px solid var(--hair); flex-wrap: wrap; }
  .vtable { }
  .vrow { display: flex; align-items: center; gap: 12px; padding: 10px 16px;
    border-top: 1px solid var(--hair); position: relative; }
  .vtable .vrow:first-child { border-top: none; }
  .vhead-row { color: var(--faint); font-size: 10.5px; text-transform: uppercase;
    letter-spacing: 0.7px; font-weight: 650; padding: 8px 16px; }
  .vc-ver { flex: 1; font-family: var(--mono); font-size: 12.5px; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vc-dir { width: 64px; flex: none; display: flex; align-items: center; justify-content: center; }
  /* Directory link: circular borderless button revealing the version directory */
  .btn.dir { width: 30px; height: 30px; padding: 0; border-radius: 50%;
    border: none; background: transparent; color: var(--dim);
    display: inline-flex; align-items: center; justify-content: center;
    transition: background .15s, color .15s; }
  .btn.dir svg { width: 15px; height: 15px; }
  .btn.dir:hover { background: var(--cell-hover); color: var(--accent2); }
  .btn.dir:active { transform: translateY(1px); }
  .btn.dir:disabled { opacity: 0.4; cursor: default; transform: none; }
  .btn.dir:focus-visible { outline: 2px solid var(--accent2); outline-offset: 2px; }
  .vc-acts { width: 72px; flex: none; display: flex; align-items: center; justify-content: center; }
  /* Delete action: circular borderless button with a white trash glyph;
     hovering turns the disc red and keeps the glyph white. In light mode the
     glyph gets a dim backing disc so white-on-white stays readable. */
  .btn.del { width: 30px; height: 30px; padding: 0; border-radius: 50%;
    border: none; background: transparent; color: #fff;
    display: inline-flex; align-items: center; justify-content: center;
    transition: background .15s; }
  .btn.del svg { width: 15px; height: 15px; }
  .btn.del:hover { background: var(--err); }
  .btn.del:active { transform: translateY(1px); }
  .btn.del:disabled { opacity: 0.4; cursor: default; transform: none; }
  .btn.del:focus-visible { outline: 2px solid var(--accent2); outline-offset: 2px; }
  @media (prefers-color-scheme: light) {
    .btn.del { background: rgba(29, 36, 48, 0.32); }
    .btn.del:hover { background: var(--err); }
  }
  .vc-def { width: 64px; flex: none; display: flex; align-items: center; justify-content: center; }
  /* custom radio for the "Active" version selector (the radio makes this
     version the active engine version) */
  .vc-radio { appearance: none; -webkit-appearance: none; width: 16px; height: 16px;
    border: 1.5px solid var(--hair2); border-radius: 50%; background: transparent;
    cursor: pointer; position: relative; transition: border-color .15s, background .15s; flex: none; }
  .vc-radio:hover { border-color: var(--accent2); }
  .vc-radio:checked { border-color: var(--ok); background: var(--ok); }
  .vc-radio:checked::after { content: ""; position: absolute; width: 6px; height: 6px;
    border-radius: 50%; background: #04231a; left: 50%; top: 50%; transform: translate(-50%,-50%); }
  .vc-radio:disabled { opacity: 0.35; cursor: default; }
  .vc-radio:focus-visible { outline: 2px solid var(--accent2); outline-offset: 2px; }
  /* Install row: the persistent LAST row of the versions table — the
     published-version dropdown sits in the Version column and the
     cloud-download install button in the Actions column; the Active and
     Directory cells stay empty. */
  .vc-ver-install { display: flex; align-items: center; gap: 6px; }
  .vc-ver-install select { width: 100%; max-width: 240px; }
  /* Version-list refresh: borderless circular icon-only button (same
     treatment as the engine-card open-in-browser button) sitting right of
     the install-row dropdown. */
  .ver-refresh-btn { width: 28px; height: 28px; border-radius: 50%; border: none;
    background: transparent; color: var(--dim); cursor: pointer; display: inline-flex;
    align-items: center; justify-content: center; padding: 0; flex: none; }
  .ver-refresh-btn:hover { background: var(--cell-hover); color: var(--accent2); }
  .ver-refresh-btn:disabled { opacity: 0.4; cursor: default; }
  .ver-refresh-btn:focus-visible { outline: 2px solid var(--accent2); outline-offset: 2px; }
  .ver-refresh-btn svg { width: 16px; height: 16px; }
  /* Install action: white cloud-download glyph (same treatment as the delete
     button) — dim backing disc in light mode so white stays readable, accent
     disc on hover. */
  .btn.install { color: #fff; }
  .btn.install:hover { background: var(--accent); color: #fff; }
  @media (prefers-color-scheme: light) {
    .btn.install { background: rgba(29, 36, 48, 0.32); }
  }
  .btn.danger { background: var(--err); border-color: var(--err); color: #fff; }
  .btn.danger:hover { background: #ff6259; }
  .btn.ghost-danger { background: transparent; border-color: rgba(255,69,58,0.45);
    color: var(--err); }
  .btn.ghost-danger:hover { background: rgba(255,69,58,0.12); }
  /* delete confirmation popover */
  .pop { position: absolute; right: 40px; top: calc(100% - 2px); z-index: 40;
    background: #141b2c; border: 1px solid var(--hair2); border-radius: 11px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.55); padding: 11px 12px; min-width: 200px;
    display: none; }
  .pop.open { display: block; }
  .pop-txt { font-size: 12px; margin-bottom: 10px; color: var(--text); }
  .pop-txt b { font-family: var(--mono); }
  .pop-acts { display: flex; gap: 8px; justify-content: flex-end; }
  /* logs — the log fills the control panel and resizes with the window;
     refresh (top-right) and go-to-last (bottom-right) overlay the log itself
     as circular buttons with a background only while hovered. */
  .log-group { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  .log-wrap { position: relative; flex: 1; min-height: 0; display: flex; }
  .log-view { margin: 0; flex: 1; min-height: 0; overflow: auto; padding: 12px 0 12px 16px; }
  .log-view .ln { display: block; }
  .log-overlay { position: absolute; right: 6px; width: 32px; height: 32px;
    border-radius: 50%; border: none; background: rgba(255,255,255,0.08); color: var(--dim);
    cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
    padding: 0; z-index: 3; transition: background .15s, color .15s, opacity .15s; opacity: 0.55; }
  .log-overlay:hover { background: rgba(255,255,255,0.25); color: var(--accent2); opacity: 1; }
  .log-overlay:active { transform: translateY(1px); }
  .log-overlay:focus-visible { outline: 2px solid var(--accent2); outline-offset: 2px; }
  .log-overlay svg { width: 15px; height: 15px; }
  .log-overlay.top { top: 10px; }
  .log-overlay.bottom { bottom: 10px; }
  .log-overlay.pressed { color: var(--accent2); }
  @media (max-width: 560px) { .actions { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>

<header>
  <a class="brand-link" id="brand-link" href="https://github.com/MarcoLeongDev/harness-launcher" title="Open Harness Launcher on GitHub" aria-label="Open Harness Launcher on GitHub">
    <div class="logo"><img id="brand-logo" src="dsh-ui://localhost/brand/logo.png" alt="Harness Launcher" /></div>
    <span class="header-title">Harness Launcher</span>
    <span class="hdr-ver-subtle" id="app-ver"></span>
  </a>
  <span class="spacer"></span>
  <button class="hdr-quit" id="btn-quit" title="Quit"><i class="ico sm bi" data-ico="power"></i></button>
</header>

<!-- Single merged view: Engine + Versions (no tab bar; the log lives in a
     bottom drawer toggled by the bottom-right button). -->
<main>
  <!-- ============ ENGINE ============ -->
  <section class="tabpanel active" id="tab-main" role="tabpanel">
    <div class="group">
      <div class="ec-row">
        <div class="ec-status-icon stopped" id="st-icon" aria-label="Engine status">
          <i class="ico bi" data-ico="moon"></i>
        </div>
        <div class="ec-select-wrap" id="ver-wrap">
          <select id="sel-version" class="ec-select" aria-label="Engine version" disabled></select>
          <svg id="ver-chevron" style="display:none" viewBox="0 0 16 16" fill="currentColor"><path d="M1.646 4.646a.5.5 0 0 1 .708 0L8 10.293l5.646-5.647a.5.5 0 0 1 .708.708l-6 6a.5.5 0 0 1-.708 0l-6-6a.5.5 0 0 1 0-.708z"/></svg>
        </div>
        <span class="ec-sep">:</span>
        <div class="ec-select-wrap" id="host-wrap">
          <span id="host-text" class="ec-ver">127.0.0.1</span>
        </div>
        <span class="ec-sep">:</span>
        <input id="inp-port" class="ec-port" type="number" min="1" max="65535" aria-label="Port" disabled />
        <button class="ec-open-btn" id="btn-open" title="Open in browser" aria-label="Open in browser"><i class="ico sm bi" data-ico="box-arrow-up-right"></i></button>
        <div class="ec-actions">
          <button class="ec-btn icon-start" id="btn-toggle" title="Start"><i class="ico bi" data-ico="play-fill"></i></button>
          <button class="ec-btn icon-restart" id="btn-restart" disabled title="Restart"><i class="ico bi" data-ico="arrow-repeat"></i></button>
        </div>
      </div>
    </div>

    <!-- Update banner (versions flow) sits right under the engine card -->
    <div class="group" id="update-banner" style="display:none">
      <div class="cell">
        <i class="ico sm bi" style="color:var(--accent2)" data-ico="cloud-arrow-down-fill"></i>
        <span class="hint" id="update-banner-text" style="flex:1"></span>
        <button class="btn primary" id="btn-banner-update">Update</button>
      </div>
    </div>

    <!-- The installed-versions table. Installation is merged into the table:
         the header is Active | Version | Directory | Actions, installed
         versions occupy the middle rows (radio | version | open-directory |
         delete), and the LAST row is always the install row — empty | dropdown
         | empty | cloud-download. The standalone "Install version" group is
         gone; the dropdown and button keep their IDs so the script logic is
         untouched. -->
    <div class="group">
      <div class="vtable">
        <div class="vrow vhead-row">
          <span class="vc-def" title="Active version">Active</span>
          <span class="vc-ver">Version</span>
          <span class="vc-dir" title="Open the version directory">Directory</span>
          <span class="vc-acts">Actions</span>
        </div>
        <div id="ver-tbody"></div>
        <!-- Install row: the persistent LAST row of the table. Empty
             Active/Directory cells keep the columns aligned with the rows
             above; the button downloads the selected version without touching
             the running engine (switching stays on the radio / engine card). -->
        <div class="vrow vinstall-row">
          <span class="vc-def" aria-hidden="true"></span>
          <span class="vc-ver vc-ver-install">
            <select id="sel-install-ver" aria-label="Version to install"></select>
            <button class="ver-refresh-btn" id="btn-refresh-versions" title="Refresh version list" aria-label="Refresh version list"><i class="ico sm bi" data-ico="arrow-clockwise"></i></button>
          </span>
          <span class="vc-dir" aria-hidden="true"></span>
          <span class="vc-acts">
            <button class="btn icon install" id="btn-install" title="Download selected version" aria-label="Download selected version">
              <i class="ico sm bi" data-ico="cloud-arrow-down-fill"></i>
            </button>
          </span>
        </div>
      </div>
    </div>

    <!-- Operation feeds: notifications (progress messages, npm output,
         result/error lines) render in their own section BELOW the versions
         table — never between the table's rows. One REUSABLE feed per
         operation — parallel downloads each get their own terminal (head +
         output + circular stop button overlay) instead of fighting over one
         div. The section is only visible while it has content: #op-feeds:empty
         (CSS) collapses it once the last feed animates out. NOTE: keep this
         element empty (no whitespace inside) so :empty keeps matching. -->
    <div class="group op-feeds-group" id="op-feeds"></div>
  </section>

  <!-- ============ LOG DRAWER (hidden by default; toggled by the bottom-right button) ============ -->
  <div class="log-drawer" id="log-drawer" hidden>
    <div class="log-group">
      <div class="log-wrap">
        <pre class="log-view terminal" id="log-tail">No output yet</pre>
        <button class="log-overlay bottom pressed" id="btn-log-follow" title="Go to last line" aria-pressed="true"><i class="ico sm bi" data-ico="arrow-down-circle-fill"></i></button>
      </div>
    </div>
  </div>
</main>

<!-- Log visibility toggle: circular borderless button pinned bottom-right.
     Image only — no background or border except while hovered. -->
<button class="log-toggle" id="btn-log-toggle" type="button" aria-pressed="false" aria-controls="log-drawer" title="Show log">
  <i class="ico sm bi" data-ico="journal-text"></i>
</button>

<script>
(function () {
  'use strict';
  if (window.__DSH_CP__) return;
  window.__DSH_CP__ = true;

  function invoke(cmd, args) {
    var core = window.__TAURI__ && window.__TAURI__.core;
    if (core && typeof core.invoke === 'function') return core.invoke(cmd, args || {});
    if (window.__TAURI_INTERNALS__ && typeof window.__TAURI_INTERNALS__.invoke === 'function')
      return window.__TAURI_INTERNALS__.invoke(cmd, args || {}, undefined);
    return Promise.reject(new Error('Tauri IPC unavailable in this context'));
  }
  function listen(evt, cb) {
    var ev = window.__TAURI__ && window.__TAURI__.event;
    if (ev && typeof ev.listen === 'function') return ev.listen(evt, function (e) { cb(e.payload); });
    return Promise.resolve();
  }

  var $ = function (id) { return document.getElementById(id); };

  function loadIconsIn(root) {
    var icons = root.querySelectorAll('i.ico.bi[data-ico]');
    for (var i = 0; i < icons.length; i++) {
      (function (el) {
        if (el.getAttribute('data-loaded')) return;
        var name = el.getAttribute('data-ico');
        if (!name) return;
        // The fetched SVG is injected as markup, so the icon name is
        // constrained to the bundled set (lowercase letters, digits, dashes).
        if (!/^[a-z0-9-]+$/.test(name)) return;
        var url = 'dsh-ui://localhost/bootstrap-icons/' + name + '.svg';
        fetch(url).then(function (r) {
          if (!r.ok) return;
          return r.text();
        }).then(function (svg) {
          if (!svg) return;
          var wrapper = document.createElement('span');
          wrapper.innerHTML = svg;
          var svgEl = wrapper.querySelector('svg');
          if (!svgEl) return;
          svgEl.classList.add('ico');
          if (el.classList.contains('sm')) svgEl.classList.add('sm');
          svgEl.removeAttribute('width');
          svgEl.removeAttribute('height');
          el.setAttribute('data-loaded', '1');
          el.parentNode.replaceChild(svgEl, el);
        }).catch(function () {});
      })(icons[i]);
    }
  }

  var sel = {
    stIcon: $('st-icon'),
    toggle: $('btn-toggle'), restart: $('btn-restart'),
    engineVer: $('sel-version'), verWrap: $('ver-wrap'), verChevron: $('ver-chevron'),
    host: $('host-text'), hostWrap: $('host-wrap'),
    port: $('inp-port'),
    
    installSel: $('sel-install-ver'), btnInstall: $('btn-install'), btnRefreshVer: $('btn-refresh-versions'),
    verTbody: $('ver-tbody'),
    feedsBox: $('op-feeds'),
    logFollow: $('btn-log-follow'), logTail: $('log-tail'),
    logToggle: $('btn-log-toggle'), logDrawer: $('log-drawer'),
    banner: $('update-banner'), bannerText: $('update-banner-text'), bannerBtn: $('btn-banner-update'),
    appVer: $('app-ver'),
    browser: $('btn-open'), quit: $('btn-quit')
  };

  var followOn = true;
  var lastPhase = 'stopped';


  // ---------- merged single view ----------
  // Engine + Versions are one panel with no tab bar; the log lives in a
  // bottom drawer toggled by the bottom-right button below.

  // ---------- operation feed (terminal cell of the versions table) ----------
  function fmtTime(secs) {
    secs = Math.max(0, Math.floor(secs));
    var m = Math.floor(secs / 60), s = secs % 60;
    return m + ':' + (s < 10 ? '0' : '') + s;
  }
  // ---------- operation feeds: one reusable terminal per operation ----------
  // Every in-flight operation (parallel version downloads included) owns one
  // feed — head (npm command + elapsed) and terminal output — so concurrent
  // downloads never fight over a single output div. There is no stop/cancel
  // control: stuck npm operations are bounded by the run timeout.
  // Download-ish operations during npm phases show the header (command +
  // elapsed); pure message phases (registry checks, engine stop/start/
  // restart, port changes, notices) render as terminal info lines only.
  var downloadingOps = { download: 1, switch: 1, update: 1, rollback: 1, install: 1, select: 1 };
  var downloadingPhases = { installing: 1, verifying: 1 };
  // Ops that stop/start/restart the engine: while any runs, engine controls
  // are disabled. Plain downloads (kind "download") never touch the engine.
  var engineBusyOps = { switch: 1, update: 1, rollback: 1, engine: 1, port: 1 };
  var feeds = {};        // op key -> feed object
  var closedOps = {};    // op key -> true once the op reached a terminal phase
                         // (done/failed/cancelled); late console lines for
                         // closed ops must never re-create their feed
  var noticeFeed = null; // terminal surface for launcher-level notices
  var lastResultText = '', lastResultAt = 0;

  function opKind(op) { return String(op || '').split(':')[0]; }

  function makeFeed(opKey) {
    var el = document.createElement('div');
    el.className = 'op-feed idle';
    el.hidden = true;
    el.innerHTML =
      '<div class="op-feed-head" hidden>' +
        '<i class="ico sm bi" style="color:var(--accent2)" data-ico="terminal-fill"></i>' +
        '<span class="op-feed-cmd">Installing DeepSeek Harness version</span>' +
        '<span class="op-feed-elapsed">0:00</span>' +
      '</div>' +
      '<div class="op-feed-body">' +
        '<pre class="term-out terminal" aria-live="polite"></pre>' +
      '</div>';
    sel.feedsBox.appendChild(el);
    loadIconsIn(el);
    var head = el.querySelector('.op-feed-head');
    var cmd = el.querySelector('.op-feed-cmd');
    var elapsedEl = el.querySelector('.op-feed-elapsed');
    var out = el.querySelector('.term-out');
    var feed = {
      opKey: opKey, el: el, downloading: false, done: false,
      start: null, lastPhase: null,
      elapsedTimer: null, stuckTimer: null, hideTimer: null,
      append: function (stream, text) {
        var ln = document.createElement('span');
        ln.className = 'ln ' + (stream === 'err' ? 'err' : stream === 'info' ? 'info' : 'out');
        ln.textContent = text;
        out.appendChild(ln);
        while (out.childElementCount > 400) out.removeChild(out.firstChild);
        out.scrollTop = out.scrollHeight;
        el.hidden = false;
      },
      setHeader: function (text) {
        cmd.textContent = text;
        head.hidden = false;
        el.hidden = false;
      },
      setDownloading: function (on) {
        feed.downloading = on;
        el.classList.toggle('idle', !on);
        el.hidden = false;
        head.hidden = !on;
        if (!on) {
          if (feed.elapsedTimer) { clearInterval(feed.elapsedTimer); feed.elapsedTimer = null; }
          if (feed.stuckTimer) { clearTimeout(feed.stuckTimer); feed.stuckTimer = null; }
        } else {
          if (feed.hideTimer) { clearTimeout(feed.hideTimer); feed.hideTimer = null; }
          if (!feed.start) feed.start = Date.now();
          if (!feed.elapsedTimer) {
            feed.elapsedTimer = setInterval(function () {
              elapsedEl.textContent = fmtTime((Date.now() - feed.start) / 1000);
            }, 1000);
          }
        }
      },
      // After 60 s with no progress output, surface a hint in the terminal.
      armStuck: function () {
        if (feed.stuckTimer) clearTimeout(feed.stuckTimer);
        feed.stuckTimer = setTimeout(function () {
          if (feed.downloading) feed.append('info', 'no progress for 60s — still working…');
        }, 60000);
      },
      // Keep the terminal visible briefly after the operation settles, then
      // animate the feed out and remove it — the container collapses. The
      // dismissal is scheduled EXACTLY ONCE: repeat terminal events (a
      // cancelled op re-reported on refresh) must not extend the wait, or a
      // stopped download would linger on screen.
      finishSoon: function (ms) {
        feed.done = true;
        feed.setDownloading(false);
        if (feed.hideTimer) return;
        feed.hideTimer = setTimeout(function () {
          if (feed.downloading) return;
          el.classList.add('leaving');
          setTimeout(function () {
            if (el.parentNode) el.parentNode.removeChild(el);
            delete feeds[opKey];
          }, 180);
        }, ms);
      }
    };
    feeds[opKey] = feed;
    return feed;
  }

  function feedFor(op) {
    return feeds[op] || makeFeed(op);
  }

  // Launcher-level notices (delete confirmations, engine results) surface in
  // a dedicated notice feed inside the feeds section below the versions
  // table, instead of a stray line under the install row.
  function setResult(text, isErr) {
    if (!text) return;
    var now = Date.now();
    // The same final message often arrives twice (progress event + command
    // result); appending both would duplicate the line.
    if (text === lastResultText && now - lastResultAt < 2500) { lastResultAt = now; return; }
    lastResultText = text; lastResultAt = now;
    var f = noticeFeed;
    if (!f || f.done) f = noticeFeed = makeFeed('__notice__');
    f.append(isErr ? 'err' : 'info', text);
    f.finishSoon(8000);
  }

  function busy(on) {
    [sel.toggle, sel.restart].forEach(function (b) { b.disabled = on; });
  }

  function applyProgress(p) {
    if (!p) return;
    var kind = opKind(p.op);
    var f = feedFor(p.op || '');
    // Download-ish operations during download phases show the feed header
    // (npm command + elapsed timer); pure message phases (engine
    // stop/start/restart, port changes, verification-only runs, notices)
    // stream as terminal info lines only. There is no stop/cancel control.
    var downloading = !!downloadingOps[kind] && !!downloadingPhases[p.phase];
    if (downloading) {
      f.done = false;
      f.setDownloading(true);
      f.setHeader('Installing DeepSeek Harness version@' + (p.version || ''));
    }
    // Milestone messages (registry → installing → verifying, stopping →
    // starting → running) stream in as info lines so the terminal tells the
    // whole story for engine-affecting operations too.
    if (p.message && p.phase !== f.lastPhase) {
      f.lastPhase = p.phase;
      if (downloading || engineBusyOps[kind]) f.append('info', p.message);
    }
    if (downloading && p.message) f.armStuck();
    if (engineBusyOps[kind]) busy(true);
    if (p.phase === 'done' || p.phase === 'failed' || p.phase === 'cancelled') {
      closedOps[p.op || ''] = true;
      if (f.lastPhase !== p.phase) {
        f.lastPhase = p.phase;
        f.append(p.phase === 'done' ? 'info' : 'err', p.message || (p.phase === 'done' ? 'Completed' : p.phase));
      }
      f.finishSoon(p.phase === 'done' ? 8000 : 10000);
      if (engineBusyOps[kind]) setTimeout(function () { busy(false); }, 2500);
      setTimeout(refresh, 700);
    }
    if (p.phase === 'running' || p.phase === 'stopped') {
      setTimeout(function () { busy(false); }, 1200);
      if (p.phase === 'stopped') setTimeout(refresh, 700);
    }
  }

  function closePopovers() {
    var ps = document.querySelectorAll('.pop.open');
    for (var i = 0; i < ps.length; i++) ps[i].classList.remove('open');
  }
  function renderVersions(s) {
    var list = (s.installedVersions || []).slice().sort();
    sel.verTbody.innerHTML = '';
    if (!list.length) {
      var empty = document.createElement('div');
      empty.className = 'vrow';
      empty.innerHTML = '<span class="hint">No versions installed — pick one below to install.</span>';
      sel.verTbody.appendChild(empty);
      return;
    }
    list.forEach(function (v) {
      var row = document.createElement('div');
      row.className = 'vrow';
      var isActive = s.activeVersion === v;

      // Active column: a radio that selects this version as the active one.
      var defCell = document.createElement('span');
      defCell.className = 'vc-def';
      var radio = document.createElement('input');
      radio.type = 'radio';
      radio.name = 'dsh-active-version';
      radio.className = 'vc-radio';
      radio.checked = isActive;
      radio.disabled = isActive || !!s.currentOp;
      radio.title = isActive ? 'This is the active version' : 'Make v' + v + ' the active version';
      radio.addEventListener('change', function () {
        if (radio.checked && !isActive) {
          withCmd(function () { return invoke('install_and_switch', { version: v }); }, 'Switched');
        }
      });
      defCell.appendChild(radio);

      var ver = document.createElement('span');
      ver.className = 'vc-ver'; ver.textContent = 'v' + v;

      // Directory column: opens the directory this version is installed in.
      var dirCell = document.createElement('span');
      dirCell.className = 'vc-dir';
      var dirBtn = document.createElement('button');
      dirBtn.className = 'btn dir';
      dirBtn.title = 'Open the directory for v' + v;
      dirBtn.setAttribute('aria-label', 'Open the directory for v' + v);
      dirBtn.innerHTML = '<i class="ico sm bi" data-ico="folder2-open"></i>';
      dirBtn.addEventListener('click', function () {
        invoke('open_version_dir', { version: v }).catch(function (e) {
          setResult(String(e && e.message || e), true);
        });
      });
      dirCell.appendChild(dirBtn);

      // Actions column: circular red trash button with confirmation popover.
      var acts = document.createElement('span');
      acts.className = 'vc-acts';
      var del = document.createElement('button');
      del.className = 'btn del';
      del.title = 'Delete this version';
      del.disabled = isActive || !!s.currentOp;
      del.innerHTML = '<i class="ico sm bi" data-ico="trash-fill"></i>';
      var pop = document.createElement('div');
      pop.className = 'pop';
      pop.setAttribute('role', 'dialog');
      pop.setAttribute('aria-label', 'Delete version v' + v + '?');
      // Built with DOM nodes (never innerHTML with the version string): `v`
      // comes from the registry version list and must render as inert text.
      var popTxt = document.createElement('div');
      popTxt.className = 'pop-txt';
      popTxt.appendChild(document.createTextNode('Delete '));
      var popVer = document.createElement('b');
      popVer.textContent = 'v' + v;
      popTxt.appendChild(popVer);
      popTxt.appendChild(document.createTextNode('? This cannot be undone.'));
      var popActs = document.createElement('div');
      popActs.className = 'pop-acts';
      var cancelBtn = document.createElement('button');
      cancelBtn.className = 'btn';
      cancelBtn.setAttribute('data-act', 'cancel');
      cancelBtn.textContent = 'Cancel';
      var confirmBtn = document.createElement('button');
      confirmBtn.className = 'btn danger';
      confirmBtn.setAttribute('data-act', 'confirm');
      confirmBtn.textContent = 'Delete';
      popActs.appendChild(cancelBtn);
      popActs.appendChild(confirmBtn);
      pop.appendChild(popTxt);
      pop.appendChild(popActs);
      del.addEventListener('click', function (e) {
        e.stopPropagation();
        closePopovers();
        pop.classList.add('open');
        document.addEventListener('click', function outer(ev) {
          if (!pop.contains(ev.target) && ev.target !== del) {
            pop.classList.remove('open');
            document.removeEventListener('click', outer);
          }
        });
      });
      pop.querySelector('[data-act="cancel"]').addEventListener('click', function () {
        pop.classList.remove('open');
      });
      pop.querySelector('[data-act="confirm"]').addEventListener('click', function () {
        pop.classList.remove('open');
        invoke('delete_version', { version: v }).then(function () { return refresh(); })
          .catch(function (e) { setResult(String(e && e.message || e), true); return refresh(); });
      });
      acts.appendChild(del);
      row.appendChild(defCell); row.appendChild(ver); row.appendChild(dirCell); row.appendChild(acts);
      row.appendChild(pop);
      sel.verTbody.appendChild(row);
    });
    // Icons created above use data-ico; let the icon loader pick them up.
    loadIconsIn(sel.verTbody);
  }

  function renderStatus(s) {
    var running = !!s.running;
    sel.appVer.textContent = s.launcherVersion || '';

    var phase = s.enginePhase || (running ? 'running' : 'stopped');
    lastPhase = phase;

    // Status icon
    var iconCls = 'stopped';
    var iconIco = 'moon';
    if (phase === 'running') { iconCls = 'running'; iconIco = 'gear'; }
    else if (phase === 'stopped') { iconCls = 'stopped'; iconIco = 'moon'; }
    else { iconCls = 'error'; iconIco = 'exclamation-circle-fill'; }
    sel.stIcon.className = 'ec-status-icon ' + iconCls;
    sel.stIcon.innerHTML = '<i class="ico bi" data-ico="' + iconIco + '"></i>';
    // innerHTML replacement discards any previously swapped-in SVG; re-run the
    // loader so the status icon renders on every status update.
    loadIconsIn(sel.stIcon);

    // Running state: show version as text, port as text
    // Stopped state: show version as dropdown, port as input
    var runningLike = phase !== 'stopped';

    // The version dropdown is offered in BOTH states: while stopped it picks
    // the version to run next (set_version); while running it performs a live
    // switch — the backend stops the engine, installs/sets the version and
    // starts the new one again.
    sel.verWrap.innerHTML = '';
    sel.verWrap.appendChild(sel.engineVer);
    sel.verWrap.appendChild(sel.verChevron);
    sel.engineVer.style.display = '';
    sel.verChevron.style.display = '';
    sel.engineVer.disabled = false;
    sel.verWrap.style.cursor = 'pointer';

    if (runningLike) {
      // Port as text
      sel.port.type = 'text';
      sel.port.readOnly = true;
      sel.port.value = s.actualPort || 0;
    } else {
      // Port as input
      sel.port.type = 'number';
      sel.port.readOnly = false;
      sel.port.disabled = false;
    }

    // Toggle button (icon only, circular). innerHTML resets the icon to a
    // placeholder <i>; re-run the loader or the Start/Stop glyph vanishes.
    if (runningLike) {
      sel.toggle.className = 'ec-btn icon-stop';
      sel.toggle.innerHTML = '<i class="ico bi" data-ico="pause-fill"></i>';
      sel.toggle.title = 'Stop';
    } else {
      sel.toggle.className = 'ec-btn icon-start';
      sel.toggle.innerHTML = '<i class="ico bi" data-ico="play-fill"></i>';
      sel.toggle.title = 'Start';
    }
    loadIconsIn(sel.toggle);
    sel.toggle.disabled = false;
    sel.restart.disabled = !runningLike;

    // version dropdown lists downloaded versions only
    var inst = s.installedVersions || [];
    var curV = s.activeVersion;
    sel.engineVer.innerHTML = '';
    inst.forEach(function (v) {
      var o = document.createElement('option');
      o.value = v; o.textContent = 'v' + v;
      sel.engineVer.appendChild(o);
    });
    if (curV && inst.indexOf(curV) !== -1) sel.engineVer.value = curV;

    if (!runningLike && sel.port.value === '') sel.port.value = String(s.port);

    
    if (s.updateAvailable && s.latestRemote) {
      sel.banner.style.display = '';
      sel.bannerText.textContent = 'Update available: v' + (s.activeVersion || '?') + ' → v' + s.latestRemote;
    } else {
      sel.banner.style.display = 'none';
    }

    fillVersionSelects(s);
    renderVersions(s);

    // Rebuild feed state: every in-flight operation (parallel downloads
    // included) gets its own feed, then each feed's terminal is seeded ONCE
    // from the console snapshot so it tells the whole story from the start
    // (refresh polls every few seconds and must not duplicate lines).
    var activeOps = s.currentOps || (s.currentOp ? [s.currentOp] : []);
    activeOps.forEach(function (p) { if (p) applyProgress(p); });
    if (!activeOps.length) busy(false);
    if (s.console && s.console.length) {
      s.console.forEach(function (line) {
        if (!line || !line.text || !line.op) return;
        var f = feeds[line.op];
        if (f && !f.seeded) { f.seeded = true; f.append(line.stream || 'out', line.text); }
      });
    }
  }

    function fillVersionSelects(s) {
    var all = s.versions || [];
    var cur = sel.installSel.value;
    sel.installSel.innerHTML = '';
    (all.length ? all : (s.installedVersions || [])).forEach(function (v) {
      var o = document.createElement('option');
      o.value = v;
      o.textContent = 'v' + v + (s.installedVersions && s.installedVersions.indexOf(v) !== -1 ? '  ✓' : '');
      sel.installSel.appendChild(o);
    });
    // The dropdown defaults to the NEWEST published version — the backend
    // returns the list sorted ascending, so the last option is the latest.
    // When that version is not installed yet it renders without a ✓, so the
    // versions table instantly shows what's worth downloading next and a
    // separate "Get latest" button is unnecessary (the installed-versions
    // table + radio already cover switching the active version).
    var latest =
      (s.latestRemote && all.indexOf(s.latestRemote) !== -1) ? s.latestRemote :
      (all.length ? all[all.length - 1] : null);
    if (cur && all.indexOf(cur) !== -1) { sel.installSel.value = cur; return; }
    if (latest && all.indexOf(latest) !== -1) { sel.installSel.value = latest; return; }
    if (s.activeVersion && all.indexOf(s.activeVersion) !== -1) sel.installSel.value = s.activeVersion;
  }

  function refresh() {
    return invoke('get_status').then(function (s) {
      renderStatus(s);
    }).catch(function (e) {
      setResult(String(e && e.message || e), true);
    });
  }

  function withCmd(fn, label) {
    fn().then(function (res) {
      setResult(res || label + ' ✓', false);
      return refresh();
    }).catch(function (e) {
      setResult(String(e && e.message || e), true);
      return refresh();
    });
  }

  // Log lines render as coloured .ln spans — the same palette the operation
  // feeds use — and ANSI escapes from the harness are stripped.
  function logLineClass(line) {
    if (/error|fail(?:ed|ure)?|panic|exception|ENOENT|EADDR|exited with code/i.test(line)) return 'err';
    if (/^\[launcher\]|dsh web:|engine (running|stopped|starting)|installed|updated|update available|checking/i.test(line)) return 'info';
    return 'out';
  }
  function refreshLog() {
    invoke('tail_logs', { lines: 300 }).then(function (text) {
      var pre = sel.logTail;
      var atBottom = (pre.scrollHeight - (pre.scrollTop + pre.clientHeight)) / pre.scrollHeight <= 0.01;
      var raw = String(text || '').replace(/\u001b\[[0-9;]*m/g, '');
      // Censor auth tokens in log output (token=... query params and bearer tokens)
      raw = raw.replace(/token=[^\s&"'\)\]]+/gi, 'token=[CENSORED]').replace(/bearer\s+[a-zA-Z0-9_\-\.]+/gi, 'bearer [CENSORED]');
      var lines = raw.split('\n');
      pre.textContent = '';
      for (var i = 0; i < lines.length; i++) {
        if (!lines[i].trim()) continue;
        var ln = document.createElement('span');
        ln.className = 'ln ' + logLineClass(lines[i]);
        ln.textContent = lines[i] || ' ';
        pre.appendChild(ln);
      }
      if (!pre.childElementCount) {
        var empty = document.createElement('span');
        empty.className = 'ln info';
        empty.textContent = '(no logs yet)';
        pre.appendChild(empty);
      }
      if (followOn || atBottom) pre.scrollTop = pre.scrollHeight;
    }).catch(function () {});
  }

  // engine
  sel.engineVer.addEventListener('change', function () {
    var v = sel.engineVer.value;
    if (!v) return;
    // When stopped, selecting a version just records the choice (does not
    // auto-launch); press Start to run it. When running, switching hands over
    // live: the backend stops the engine, installs/sets the version and
    // starts the new one — no manual stop required.
    if (lastPhase !== 'stopped') {
      withCmd(function () { return invoke('install_and_switch', { version: v }); }, 'Switched');
    } else {
      withCmd(function () { return invoke('set_version', { version: v }); }, 'Version set');
    }
  });
  sel.toggle.addEventListener('click', function () {
    if (lastPhase === 'running') {
      withCmd(function () { return invoke('engine_stop', {}); }, 'Stopped');
    } else {
      withCmd(function () { return invoke('engine_start', {}); }, 'Started');
    }
  });
  sel.restart.addEventListener('click', function () { withCmd(function () { return invoke('engine_restart', {}); }, 'Restarted'); });

  // port: save on blur (and Enter). When stopped this only persists the port;
  // it does NOT auto-start the engine (handled in set_port on the backend).
  function applyPort() {
    var p = parseInt(sel.port.value, 10);
    if (!p || p < 1 || p > 65535) return setResult('Enter a valid port (1–65535)', true);
    withCmd(function () { return invoke('set_port', { port: p }); }, 'Port set');
  }
  sel.port.addEventListener('blur', applyPort);
  sel.port.addEventListener('keydown', function (e) { if (e.key === 'Enter') sel.port.blur(); });

  // versions table
  sel.btnInstall.addEventListener('click', function () {
    var v = sel.installSel.value;
    if (!v) return;
    // Download only: never switches the active version and never touches a
    // running engine — downloading works while the engine runs. Switching is
    // the versions-table radio / engine-card dropdown.
    withCmd(function () { return invoke('download_version', { version: v }); }, 'Downloaded');
  });
  sel.installSel.addEventListener('change', function () { closePopovers(); });
  // Manual version-list refresh: bypass the status-poll cache and re-fetch
  // the published list now. The button busy-disables while npm answers;
  // the repaint keeps the user's selection via fillVersionSelects.
  sel.btnRefreshVer.addEventListener('click', function () {
    sel.btnRefreshVer.disabled = true;
    invoke('refresh_versions', {}).then(function (res) {
      setResult(res || 'Version list refreshed', false);
      return refresh();
    }).catch(function (e) {
      setResult(String(e.message || e), true);
      return refresh();
    }).then(function () { sel.btnRefreshVer.disabled = false; });
  });
  sel.bannerBtn.addEventListener('click', function () { withCmd(function () { return invoke('update_to_latest', {}); }, 'Updated'); });



  // logs
  // Log drawer toggle: bottom-right circular image-only button. The drawer
  // is hidden by default; the button shows/hides it (aria-pressed tracks state).
  sel.logToggle.addEventListener('click', function () {
    var open = sel.logDrawer.hidden;
    sel.logDrawer.hidden = !open;
    sel.logDrawer.classList.toggle('open', open);
    sel.logToggle.setAttribute('aria-pressed', open ? 'true' : 'false');
    sel.logToggle.title = open ? 'Hide log' : 'Show log';
    if (open) refreshLog();
  });
  // Go to last line: jump to the end of the log and keep following it.
  sel.logFollow.addEventListener('click', function () {
    followOn = true;
    sel.logFollow.setAttribute('aria-pressed', 'true');
    sel.logFollow.classList.add('pressed');
    refreshLog();
  });

  sel.browser.addEventListener('click', function () { invoke('open_in_browser', {}).catch(function (e) { setResult(String(e.message || e), true); }); });
  // Brand header (logo, app name, version): opens the project GitHub page.
  // preventDefault keeps the panel on dsh-ui:// instead of navigating away.
  $('brand-link').addEventListener('click', function (e) { e.preventDefault(); invoke('open_repo_page', {}).catch(function (err) { setResult(String(err.message || err), true); }); });
  sel.quit.addEventListener('click', function () { invoke('quit_app', {}); });

  // events
  listen('launcher://progress', function (p) { if (p) applyProgress(p); });
  listen('launcher://console', function (line) {
    if (!line || !line.text) return;
    // Lines tagged with an operation stream into THAT operation's feed;
    // stray launcher-level lines (like delete confirmations) surface as
    // notifications instead of piling up invisibly.
    if (line.op && !closedOps[line.op]) {
      var f = feedFor(line.op);
      f.seeded = true; // live lines supersede the snapshot seed
      f.append(line.stream || 'out', line.text);
      if (f.downloading) f.armStuck();
    } else if (!line.op) {
      setResult(line.text, line.stream === 'err');
    }
  });
  listen('launcher://status', function () { refresh(); });

  loadIconsIn(document);

  refresh();
  refreshLog();
  setInterval(refresh, 3000);
  setInterval(refreshLog, 5000);
})();
</script>
</body>
</html>
