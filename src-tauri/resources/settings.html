<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<title>Harness Launcher - Control Panel</title>
<link rel="stylesheet" href="/settings.css" />
</head>
<body>

<header>
  <a class="brand-link" id="brand-link" href="https://github.com/MarcoLeongDev/harness-launcher" title="Open Harness Launcher on GitHub" aria-label="Open Harness Launcher on GitHub" data-i18n-title="brandGithub" data-i18n-aria="brandGithub">
    <div class="logo"><img id="brand-logo" src="dsh-ui://localhost/brand/logo.png" alt="Harness Launcher" /></div>
    <span class="header-title">Harness Launcher</span>
    <span class="hdr-ver-subtle" id="app-ver"></span>
  </a>
  <span class="spacer"></span>
  <div class="lang-seg" id="lang-seg" role="group" aria-label="Language" data-i18n-aria="languageName">
    <button type="button" data-lang="en" aria-pressed="true">En</button><button type="button" data-lang="zh-Hant" aria-pressed="false">繁</button><button type="button" data-lang="zh-Hans" aria-pressed="false">簡</button><button type="button" data-lang="ja" aria-pressed="false">日</button><button type="button" data-lang="es" aria-pressed="false">Es</button>
  </div>
  <button class="hdr-quit" id="btn-quit" title="Quit" aria-label="Quit" data-i18n-title="quit" data-i18n-aria="quit"><i class="ico sm bi" data-ico="power"></i></button>
</header>

<!-- Single merged view: Engine + Versions (no tab bar; the log lives in a
     bottom drawer toggled by the bottom-right button). -->
<main>
  <!-- ============ ENGINE ============ -->
  <section class="tabpanel active" id="tab-main" role="tabpanel">
    <div class="group">
      <div class="ec-row">
        <div class="ec-status-icon stopped" id="st-icon" aria-label="Engine status" data-i18n-aria="engineStatus">
          <i class="ico bi" data-ico="moon"></i>
        </div>
        <div class="ec-select-wrap" id="ver-wrap">
          <select id="sel-version" class="ec-select" aria-label="Engine version" data-i18n-aria="engineVersion" disabled></select>
          <svg id="ver-chevron" style="display:none" viewBox="0 0 16 16" fill="currentColor"><path d="M1.646 4.646a.5.5 0 0 1 .708 0L8 10.293l5.646-5.647a.5.5 0 0 1 .708.708l-6 6a.5.5 0 0 1-.708 0l-6-6a.5.5 0 0 1 0-.708z"/></svg>
        </div>
        <span class="ec-sep">:</span>
        <div class="ec-select-wrap" id="host-wrap">
          <span id="host-text" class="ec-ver">127.0.0.1</span>
        </div>
        <span class="ec-sep">:</span>
        <input id="inp-port" class="ec-port" type="number" min="1" max="65535" aria-label="Port" data-i18n-aria="port" disabled />
        <button class="ec-open-btn" id="btn-open" title="Open in browser" aria-label="Open in browser" data-i18n-title="openBrowser" data-i18n-aria="openBrowser"><i class="ico sm bi" data-ico="link-45deg"></i></button>
        <div class="ec-actions">
          <button class="ec-btn icon-start" id="btn-toggle" title="Start"><i class="ico bi" data-ico="play-fill"></i></button>
          <button class="ec-btn icon-restart" id="btn-restart" disabled title="Restart" data-i18n-title="restart"><i class="ico bi" data-ico="arrow-repeat"></i></button>
        </div>
      </div>
    </div>

    <!-- Update banner (versions flow) sits right under the engine card -->
    <div class="group" id="update-banner" style="display:none">
      <div class="cell">
        <i class="ico sm bi" style="color:var(--accent2)" data-ico="cloud-arrow-down-fill"></i>
        <span class="hint" id="update-banner-text" style="flex:1"></span>
        <button class="btn primary" id="btn-banner-update" data-i18n="updateBtn">Update</button>
      </div>
    </div>

    <!-- The installed-versions table. Installation is merged into the table:
         the header is Active | Version | Directory | Actions, installed
         versions occupy the middle rows (radio | version | open-directory |
         delete), and the LAST row is always the install row — empty | dropdown
         | empty | cloud-download. The standalone "Install version" group is
         gone; the dropdown and button keep their IDs so the script logic is
         untouched. -->
    <div class="group">
      <div class="vtable">
        <div class="vrow vhead-row">
          <span class="vc-def" title="Active version" data-i18n="active" data-i18n-title="activeTitle">Active</span>
          <span class="vc-ver" data-i18n="versionCol">Version</span>
          <span class="vc-dir" title="Open the version directory" data-i18n="directory" data-i18n-title="directoryTitle">Directory</span>
          <span class="vc-acts" data-i18n="actions">Actions</span>
        </div>
        <div id="ver-tbody"></div>
        <!-- Install row: the persistent LAST row of the table. Empty
             Active/Directory cells keep the columns aligned with the rows
             above; the button downloads the selected version without touching
             the running engine (switching stays on the radio / engine card). -->
        <div class="vrow vinstall-row">
          <span class="vc-def" aria-hidden="true"></span>
          <span class="vc-ver vc-ver-install">
            <select id="sel-install-ver" aria-label="Version to install" data-i18n-aria="installAria"></select>
            <button class="ver-refresh-btn" id="btn-refresh-versions" title="Refresh version list" aria-label="Refresh version list" data-i18n-title="refreshList" data-i18n-aria="refreshList"><i class="ico sm bi" data-ico="arrow-clockwise"></i></button>
          </span>
          <span class="vc-dir" aria-hidden="true"></span>
          <span class="vc-acts">
            <button class="btn icon install" id="btn-install" title="Download selected version" aria-label="Download selected version" data-i18n-title="downloadVer" data-i18n-aria="downloadVer">
              <i class="ico sm bi" data-ico="cloud-arrow-down-fill"></i>
            </button>
          </span>
        </div>
      </div>
    </div>

    <!-- Operation feeds: notifications (progress messages, npm output,
         result/error lines) render in their own section BELOW the versions
         table — never between the table's rows. One REUSABLE feed per
         operation — parallel downloads each get their own terminal (head +
         output + circular stop button overlay) instead of fighting over one
         div. The section is only visible while it has content: #op-feeds:empty
         (CSS) collapses it once the last feed animates out. NOTE: keep this
         element empty (no whitespace inside) so :empty keeps matching. -->
    <div class="group op-feeds-group" id="op-feeds"></div>
  </section>

  <!-- ============ LOG DRAWER (hidden by default; toggled by the bottom-right button) ============ -->
  <div class="log-drawer" id="log-drawer" hidden>
    <div class="log-group">
      <div class="log-wrap">
        <pre class="log-view terminal" id="log-tail" data-i18n="noOutput">No output yet</pre>
        <button class="log-overlay bottom pressed" id="btn-log-follow" title="Go to last line" aria-label="Go to last line" aria-pressed="true" data-i18n-title="goLast" data-i18n-aria="goLast"><i class="ico sm bi" data-ico="arrow-down-circle-fill"></i></button>
      </div>
    </div>
  </div>
</main>

<!-- Log visibility toggle: circular borderless button pinned bottom-right.
     Image only — no background or border except while hovered. -->
<button class="log-toggle" id="btn-log-toggle" type="button" aria-pressed="false" aria-controls="log-drawer" aria-label="Show log" title="Show log" data-i18n-title="showLog" data-i18n-aria="showLog">
  <i class="ico sm bi" data-ico="journal-text"></i>
</button>

<script src="/settings.js"></script>
</body>
</html>
