[package]
name = "dsh-launcher"
version = "0.1.66"
description = "DeepSeek Harness Launcher - a Tauri macOS menubar app that installs, updates, versions and runs the DeepSeek Harness background engine"
authors = ["hikarulsi"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "dsh_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
url = "2"

# Local one-line patch of muda 0.19.3: mark custom menu-item icons as
# template images so macOS tints them per menu appearance (see
# vendor/muda/src/platform_impl/macos/icon.rs, to_nsimage).
[patch.crates-io]
muda = { path = "vendor/muda" }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
