[package]
name = "dsh-launcher"
version = "0.1.21"
description = "DeepSeek Harness Launcher - a Tauri macOS menubar app that installs, updates, versions and runs the DeepSeek Harness background engine"
authors = ["hikarulsi"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "dsh_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
url = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
